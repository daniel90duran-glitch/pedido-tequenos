<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Tequeños</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="form-container">
        <div class="header-image-container">
            <img src="tequeños.png" alt="Pedido de Tequeños" class="header-banner">
        </div>

        <h2>Pedido de Tequeños</h2>
        <p class="promo-tag">🔥 Promoción: 1 Docena x S/ 14 | 2 Docenas x S/ 25 🔥</p>
        
        <form id="orderForm">
            <div class="form-group">
                <label for="name">Nombre Completo:</label>
                <div class="input-with-icon">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    <input type="text" id="name" required placeholder="Ej. Juan Pérez">
                </div>
            </div>

            <div class="form-group">
                <label for="phone">Teléfono / WhatsApp:</label>
                <div class="input-with-icon">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"></path>
                    </svg>
                    <input type="tel" id="phone" required placeholder="Ej. 987654321">
                </div>
            </div>

            <div class="form-group">
                <label for="address">Dirección de Entrega:</label>
                <div class="input-with-icon">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
                        <circle cx="12" cy="7" r="3"></circle>
                    </svg>
                    <input type="text" id="address" required placeholder="Ej. Av. Los Quechuas 123, Ate">
                </div>
            </div>

            <div class="form-group">
                <label for="quantity">Cantidad (en Docenas):</label>
                <div class="input-with-icon">
                    <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" y1="9" x2="20" y2="9"></line>
                        <line x1="4" y1="15" x2="20" y2="15"></line>
                        <line x1="10" y1="3" x2="8" y2="21"></line>
                        <line x1="16" y1="3" x2="14" y2="21"></line>
                    </svg>
                    <input type="number" id="quantity" min="1" value="1" required>
                </div>
            </div>

            <div class="price-summary">
                <p>Precio por Docena: <span id="unitPrice">S/ 14.00</span></p>
                <p class="total-highlight">Total a Pagar: <span id="totalPrice">S/ 14.00</span></p>
                <small id="promoApplied" class="promo-applied"></small>
            </div>

            <div class="qr-container">
                <img src="qr-yape.png" alt="Yape Marlyn Mejia" class="qr-yape-full">
                <p class="qr-instruction">Escanea el código QR desde tu app de Yape para realizar el pago antes de enviar tu pedido.</p>
            </div>

            <button type="submit" class="btn-submit">Enviar Pedido por WhatsApp</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
