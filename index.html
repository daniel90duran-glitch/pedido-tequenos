<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pedido de Tequeños</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="form-container">
        <h2>Formulario de Pedido 🥟</h2>
        <p class="promo-tag">🔥 Promoción: 1 Docena x S/ 14 | 2 Docenas x S/ 25 🔥</p>
        
        <form id="orderForm">
            <div class="form-group">
                <label for="name">Nombre Completo:</label>
                <input type="text" id="name" required placeholder="Ej. Juan Pérez">
            </div>

            <div class="form-group">
                <label for="phone">Teléfono / WhatsApp:</label>
                <input type="tel" id="phone" required placeholder="Ej. 987654321">
            </div>

            <div class="form-group">
                <label for="address">Dirección de Entrega:</label>
                <input type="text" id="address" required placeholder="Ej. Av. Los Quechuas 123, Ate">
            </div>

            <div class="form-group">
                <label for="quantity">Cantidad (en Docenas):</label>
                <input type="number" id="quantity" min="1" value="1" required>
            </div>

            <div class="price-summary">
                <p>Precio por Docena: <span id="unitPrice">S/ 14.00</span></p>
                <p class="total-highlight">Total a Pagar: <span id="totalPrice">S/ 14.00</span></p>
                <small id="promoApplied" class="promo-applied"></small>
            </div>

            <button type="submit" class="btn-submit">Enviar Pedido por WhatsApp</button>
        </form>
    </div>

    <script src="script.js"></script>
</body>
</html>
